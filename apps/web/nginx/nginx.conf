worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Los ficheros de /assets llevan el hash del contenido en el nombre: si
    # cambian, cambia la URL. Se pueden cachear para siempre sin riesgo.
    location /assets/ {
      root   /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;

      # El index.html NO se cachea nunca. Es el que dice que ficheros hay que
      # cargar; si el navegador se queda con uno viejo, sigue pidiendo la
      # version anterior de la aplicacion aunque el servidor ya tenga la nueva.
      # Nos ha pasado dos veces esta semana y las dos parecio otra cosa.
      add_header Cache-Control "no-store, must-revalidate" always;
    }
  }
}

